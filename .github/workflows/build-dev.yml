name: Build dev image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Write VERSION (upstream base tag + fork metadata)
        run: |
          git remote add upstream https://github.com/QuantumNous/new-api.git 2>/dev/null || true
          git fetch upstream --tags --force --quiet
          BASE=$(git describe --tags --match 'v*' --abbrev=0)
          VERSION="${BASE}+zmingu.${GITHUB_SHA::7}"
          echo "${VERSION}" > VERSION
          echo "Building version: ${VERSION}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zmingu/new-api:dev
            ghcr.io/zmingu/new-api:sha-${{ github.sha }}
